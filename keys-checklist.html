  .header h1 {

    -webkit-background-clip: text;

    background-clip: text;
    margin-bottom: 8px;

  .header p { color: var(--text-muted); font-size: 0.9rem; }

  .header .meta span {

    border: 1px solid var(--border);
  }
  .summary {

    gap: 12px; margin-bottom: 40px;
  }
  .summary-card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 20px; text-align: center;
    transition: border-color 0.2s;
  }
  .summary-card:hover { border-color: var(--cyan); }
  .summary-card .count { font-size: 2rem; font-weight: 700; color: var(--cyan); }
  .summary-card .label {
    color: var(--text-muted); font-size: 0.8rem; text-transform: uppercase;
    letter-spacing: 0.05em; margin-top: 4px;
  }
  .progress-section {
    margin-bottom: 40px; padding: 24px; background: var(--surface);
    border: 1px solid var(--border); border-radius: var(--radius);
  }
  .progress-header {
    display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;
  }
  .progress-header h2 { font-size: 1rem; font-weight: 600; }
  .progress-header .percentage { font-size: 1.2rem; font-weight: 700; color: var(--cyan); }
  .progress-bar { height: 6px; background: var(--surface-2); border-radius: 3px; overflow: hidden; }

    height: 100%; background: linear-gradient(90deg, var(--cyan), var(--purple));
    border-radius: 3px; transition: width 0.5s ease; width: 0%;

  .app-section {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); margin-bottom: 20px; overflow: hidden;
  }
  .app-header {
    display: flex; justify-content: space-between; align-items: center;

  .app-header:hover { background: var(--surface-2); }

  .app-domain {

    padding: 2px 10px; border-radius: 20px;
  }
  .app-badge {
    font-size: 0.7rem; padding: 2px 8px; border-radius: 4px;
    font-weight: 500; text-transform: uppercase; letter-spacing: 0.03em;

  .badge-yes { background: var(--green-dim); color: var(--green); }
  .badge-no { background: var(--red-dim); color: var(--red); }
  .app-progress { font-size: 0.85rem; color: var(--text-muted); min-width: 40px; text-align: right; }
  .app-chevron { color: var(--text-muted); margin-left: 12px; transition: transform 0.2s; font-size: 1.2rem; }
  .app-chevron.open { transform: rotate(180deg); }
  .app-body { max-height: 0; overflow: hidden; transition: max-height 0.3s ease; }
  .app-body.open { max-height: 5000px; }
  .app-body-inner { padding: 0 24px 24px; }
  .var-table { width: 100%; border-collapse: collapse; margin-top: 8px; }
  .var-table th {
    text-align: left; font-size: 0.75rem; text-transform: uppercase;
    letter-spacing: 0.05em; color: var(--text-muted); padding: 8px 12px;
    border-bottom: 1px solid var(--border); font-weight: 600;

  .var-table tr:hover td { background: rgba(255,255,255,0.02); }
  .var-name {

  .var-desc { color: var(--text-muted); font-size: 0.82rem; }
  .var-desc strong { color: var(--amber); }
  .var-source { color: var(--purple); font-size: 0.78rem; }
  .tag-secret {

  .footer { text-align: center; padding: 32px; color: var(--text-muted); font-size: 0.8rem; }
  .controls { display: flex; gap: 8px; justify-content: center; margin-bottom: 24px; flex-wrap: wrap; }
  .btn {

  .btn-primary { background: var(--cyan); color: #000; border-color: var(--cyan); font-weight: 600; }

  .checkbox-row { display: flex; align-items: center; gap: 10px; padding: 4px 0; }
  .toast {

    { name: "PRISM_API_KEY", desc: "<strong>Must match</strong> prism-engine's PRISM_API_KEY", source: "You generate", secret: true, group: "Required" },
    { name: "PRISM_API_URL", desc: "Prism Engine URL", source: "You set", secret: false, group: "Required" },
    { name: "USE_GREMLIN_RANKING", desc: "true/false — Gremlin ranking", source: "You set", secret: false, group: "Required" },
  ], deps: ["@modelcontextprotocol/sdk", "@google/generative-ai", "openai", "mongodb", "playwright", "gpt-tokenizer", "@syntaxure-labs/db"], notes: ["<strong>⚠️</strong> Uses playwright in production — needs headless browser env.", "<strong>⚠️</strong> Node.js stdio transport — NOT an HTTP server. Cannot run on Vercel."] },

  { name: "prism-analytics", domain: "❌ Not Vercel — Docker/Railway/VM", vercel: false, vars: [
    { name: "SUPABASE_URL", desc: "Supabase project URL (no NEXT_PUBLIC_ — Python)", source: "Supabase Dashboard", secret: true, group: "Required" },
    { name: "SUPABASE_SERVICE_ROLE_KEY", desc: "Service role key", source: "Supabase Dashboard", secret: true, group: "Required" },
  ], deps: ["fastapi", "uvicorn", "supabase", "pandas", "matplotlib", "seaborn", "pydantic"], notes: ["<strong>🐍</strong> Python FastAPI — build with Docker. Has Dockerfile at apps/prism-analytics/Dockerfile"] }
];

// ========================
// STORAGE
// ========================
function loadSaved() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      const saved = JSON.parse(raw);
      apps.forEach((app, ai) => {
        app.vars.forEach((v, vi) => {
          const key = `${ai}:${vi}`;
          if (saved[key]) v._checked = true;
        });
      });
    }
  } catch (e) { /* ignore */ }
}

function saveState() {
  const state = {};
  apps.forEach((app, ai) => {
    app.vars.forEach((v, vi) => {
      if (v._checked) state[`${ai}:${vi}`] = true;
    });
  });
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    const now = new Date();
    document.getElementById('lastSaved').textContent = `💾 Saved ${now.toLocaleTimeString()}`;
  } catch (e) { /* ignore */ }
}

function clearSaved() {
  if (confirm('Clear all saved progress?')) {
    localStorage.removeItem(STORAGE_KEY);
    apps.forEach(a => a.vars.forEach(v => v._checked = false));
    render();
    showToast('Progress cleared');
  }
}

// ========================
// TOAST
// ========================
let toastTimer;
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2000);
}

// ========================
// RENDER
// ========================
function render() {
  let html = '';
  apps.forEach((app, idx) => {
    const badgeClass = app.vercel ? 'badge-yes' : 'badge-no';
    const badgeText = app.vercel ? 'Vercel' : 'Self-Host';
    const totalVars = app.vars.length;
    const checkedVars = app.vars.filter(v => v._checked).length;
    html += `<div class="app-section" data-app-index="${idx}">
      <div class="app-header" onclick="toggleApp(${idx})">
        <div class="app-header-left">
          <div>
            <span class="app-name">${app.name}</span>
            <span class="app-badge ${badgeClass}">${badgeText}</span>
            <span class="app-domain">${app.domain}</span>
          </div>
        </div>
        <span class="app-progress">${checkedVars}/${totalVars}</span>
        <span class="app-chevron">▼</span>
      </div>
      <div class="app-body" id="appBody-${idx}">
        <div class="app-body-inner">
          ${renderVars(app.vars)}
          <div class="section-label">📦 Dependencies</div>
          <div class="deps">${app.deps.map(d => `<span class="dep-tag">${d}</span>`).join('')}</div>
          ${app.notes.length ? app.notes.map(n => `<div class="note">${n}</div>`).join('') : ''}
        </div>
      </div>
    </div>`;
  });
  container.innerHTML = html;
  updateStats();
}

function renderVars(vars) {
  const groups = {};
  vars.forEach(v => {
    if (!groups[v.group]) groups[v.group] = [];
    groups[v.group].push(v);
  });
  let html = '';
  Object.keys(groups).forEach(group => {
    const icon = group === 'Public' ? '🌐' : group === 'Private' ? '🔒' : group === 'Optional' ? '📋' : '⚙️';
    html += `<div class="section-label">${icon} ${group}</div>`;
    html += `<table class="var-table"><thead><tr><th style="width:28px"></th><th>Variable</th><th>Description</th><th>Source</th></tr></thead><tbody>`;
    groups[group].forEach(v => {
      const checked = v._checked ? 'checked' : '';
      const secretTag = v.secret ? '<span class="tag-secret">Secret</span>' : '';
      html += `<tr>
        <td><input type="checkbox" class="var-checkbox" data-var-id="${v.name}" ${checked} onchange="onCheckChange(event)"></td>
        <td><span class="var-name" onclick="copyVar('${v.name}')" title="Click to copy">${v.name}</span> ${secretTag}</td>
        <td><span class="var-desc">${v.desc}</span></td>
        <td><span class="var-source">${v.source}</span></td>
      </tr>`;
    });
    html += `</tbody></table>`;
  });
  return html;
}

// ========================
// FUNCTIONS
// ========================
const container = document.getElementById('appContainer');

function toggleApp(idx) {
  const body = document.getElementById(`appBody-${idx}`);
  const chevron = body.previousElementSibling.querySelector('.app-chevron');
  body.classList.toggle('open');
  chevron.classList.toggle('open');
}

function expandAll() {
  apps.forEach((_, idx) => {
    const body = document.getElementById(`appBody-${idx}`);
    const chevron = body.previousElementSibling.querySelector('.app-chevron');
    body.classList.add('open');
    chevron.classList.add('open');
  });
}

function collapseAll() {
  apps.forEach((_, idx) => {
    const body = document.getElementById(`appBody-${idx}`);
    const chevron = body.previousElementSibling.querySelector('.app-chevron');
    body.classList.remove('open');
    chevron.classList.remove('open');
  });
}

function checkAll() {
  document.querySelectorAll('.var-checkbox').forEach(cb => cb.checked = true);
  apps.forEach(a => a.vars.forEach(v => v._checked = true));
  saveState();
  updateStats();
  showToast('All checked');
}

function uncheckAll() {
  document.querySelectorAll('.var-checkbox').forEach(cb => cb.checked = false);
  apps.forEach(a => a.vars.forEach(v => v._checked = false));
  saveState();
  updateStats();
  showToast('All unchecked');
}

function copyVar(name) {
  navigator.clipboard.writeText(name).then(() => showToast(`Copied: ${name}`)).catch(() => {});
}

function onCheckChange(event) {
  const cb = event.target;
  const idx = parseInt(cb.closest('.app-section').dataset.appIndex);
  const varName = cb.dataset.varId;
  const v = apps[idx].vars.find(x => x.name === varName);
  if (v) v._checked = cb.checked;
  saveState();
  updateStats();
}

function updateStats() {
  let total = 0, checked = 0, secrets = 0;
  apps.forEach(a => {
    a.vars.forEach(v => {
      total++;
      if (v._checked) checked++;
      if (v.secret) secrets++;
    });
  });
  document.getElementById('varCount').textContent = total;
  document.getElementById('checkedCount').textContent = checked;
  document.getElementById('secretCount').textContent = secrets;
  const pct = total ? Math.round((checked / total) * 100) : 0;
  document.getElementById('percentage').textContent = pct + '%';
  document.getElementById('progressFill').style.width = pct + '%';
  apps.forEach((a, idx) => {
    const totalV = a.vars.length;
    const checkedV = a.vars.filter(v => v._checked).length;
    const header = document.querySelector(`[data-app-index="${idx}"] .app-progress`);
    if (header) header.textContent = `${checkedV}/${totalV}`;
  });
}

// Init
loadSaved();
render();
</script>
</body>
</html>
