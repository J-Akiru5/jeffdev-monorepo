<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 80" fill="none" role="img" aria-label="Syntaxure Labs">
  <defs>
    <!-- Holographic wordmark gradient -->
    <linearGradient id="logo-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#06b6d4"/>
      <stop offset="45%"  stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>

    <!-- Glow filter for accent glyphs -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Subtle glow for wordmark -->
    <filter id="text-glow" x="-5%" y="-20%" width="110%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="1.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- ── Accent bracket — left ── -->
  <g filter="url(#glow)" opacity="0.85">
    <polyline points="12,18 4,18 4,62 12,62" stroke="url(#logo-grad)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>

  <!-- ── Accent bracket — right ── -->
  <g filter="url(#glow)" opacity="0.85">
    <polyline points="468,18 476,18 476,62 468,62" stroke="url(#logo-grad)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>

  <!-- ── Star / spark accent — between brackets and text ── -->
  <g filter="url(#glow)" opacity="0.7">
    <line x1="22" y1="40" x2="30" y2="40" stroke="#06b6d4" stroke-width="1.2" stroke-linecap="round"/>
    <line x1="26" y1="36" x2="26" y2="44" stroke="#06b6d4" stroke-width="1.2" stroke-linecap="round"/>
    <line x1="23.2" y1="37.2" x2="28.8" y2="42.8" stroke="#06b6d4" stroke-width="0.9" stroke-linecap="round"/>
    <line x1="28.8" y1="37.2" x2="23.2" y2="42.8" stroke="#06b6d4" stroke-width="0.9" stroke-linecap="round"/>
  </g>

  <!-- ── Star / spark accent — right side ── -->
  <g filter="url(#glow)" opacity="0.7">
    <line x1="450" y1="40" x2="458" y2="40" stroke="#8b5cf6" stroke-width="1.2" stroke-linecap="round"/>
    <line x1="454" y1="36" x2="454" y2="44" stroke="#8b5cf6" stroke-width="1.2" stroke-linecap="round"/>
    <line x1="451.2" y1="37.2" x2="456.8" y2="42.8" stroke="#8b5cf6" stroke-width="0.9" stroke-linecap="round"/>
    <line x1="456.8" y1="37.2" x2="451.2" y2="42.8" stroke="#8b5cf6" stroke-width="0.9" stroke-linecap="round"/>
  </g>

  <!-- ── SYNTAXURE — main wordmark ── -->
  <text
    filter="url(#text-glow)"
    x="240"
    y="44"
    text-anchor="middle"
    dominant-baseline="middle"
    font-family="'Inter', 'Helvetica Neue', Arial, sans-serif"
    font-weight="700"
    font-size="28"
    letter-spacing="-0.5"
    fill="url(#logo-grad)"
  >SYNTAXURE</text>

  <!-- ── LABS — subdomain label ── -->
  <text
    x="240"
    y="63"
    text-anchor="middle"
    dominant-baseline="middle"
    font-family="'JetBrains Mono', 'Courier New', monospace"
    font-weight="400"
    font-size="9.5"
    letter-spacing="4"
    fill="#ffffff"
    opacity="0.35"
  >LABS</text>

  <!-- ── Neon underline accent ── -->
  <line x1="185" y1="52" x2="295" y2="52" stroke="url(#logo-grad)" stroke-width="0.6" opacity="0.4"/>
</svg>
