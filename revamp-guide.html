<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JeffDev Monorepo — Revamp Guide</title>
<style>
  :root {
    --bg: #0d1117;
    --surface: #161b22;
    --border: #30363d;
    --text: #e6edf3;
    --text-dim: #8b949e;
    --accent: #58a6ff;
    --green: #3fb950;
    --yellow: #d29922;
    --red: #f85149;
    --purple: #bc8cff;
    --cyan: #39d2c0;
    --radius: 8px;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.6;
    padding: 24px;
    max-width: 1000px;
    margin: 0 auto;
  }
  a { color: var(--accent); text-decoration:none; }
  a:hover { text-decoration:underline; }

  /* Header */
  .header {
    text-align:center;
    padding: 40px 0 32px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 32px;
  }
  .header h1 { font-size:1.8rem; font-weight:700; }
  .header p { color:var(--text-dim); margin-top:8px; font-size:0.9rem; }
  .header .meta { display:flex; justify-content:center; gap:16px; margin-top:12px; flex-wrap:wrap; }

  /* Progress bar */
  .progress-wrap {
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:var(--radius);
    padding:20px 24px;
    margin-bottom:24px;
  }
  .progress-stats { display:flex; justify-content:space-between; font-size:0.85rem; color:var(--text-dim); margin-bottom:8px; }
  .progress-bar { height:8px; background:#21262d; border-radius:4px; overflow:hidden; }
  .progress-fill { height:100%; width:0%; background:linear-gradient(90deg,var(--accent),var(--cyan)); border-radius:4px; transition:width .4s; }
  .progress-label { text-align:center; margin-top:8px; font-size:0.8rem; color:var(--text-dim); }

  /* Section */
  .section {
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:var(--radius);
    margin-bottom:16px;
    overflow:hidden;
  }
  .section-header {
    display:flex;
    align-items:center;
    gap:12px;
    padding:16px 20px;
    cursor:pointer;
    user-select:none;
    transition:background .15s;
  }
  .section-header:hover { background:rgba(255,255,255,.03); }
  .section-header .toggle { color:var(--text-dim); font-size:0.8rem; transition:transform .2s; }
  .section.open .section-header .toggle { transform:rotate(90deg); }
  .section-header .num {
    background:var(--accent);
    color:#000;
    font-size:0.7rem;
    font-weight:700;
    width:22px; height:22px;
    border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    flex-shrink:0;
  }
  .section-header h2 { font-size:1rem; font-weight:600; flex:1; }
  .section-header .badge-group { display:flex; gap:6px; flex-shrink:0; }

  .badge {
    display:inline-block;
    padding:2px 8px;
    border-radius:10px;
    font-size:0.7rem;
    font-weight:600;
    text-transform:uppercase;
  }
  .badge-done { background:rgba(63,185,80,.15); color:var(--green); }
  .badge-progress { background:rgba(210,153,34,.15); color:var(--yellow); }
  .badge-pending { background:rgba(139,148,158,.15); color:var(--text-dim); }
  .badge-jeff { background:rgba(88,166,255,.15); color:var(--accent); }
  .badge-lou { background:rgba(188,140,255,.15); color:var(--purple); }
  .badge-both { background:rgba(57,210,192,.15); color:var(--cyan); }

  .section-body { display:none; padding:0 20px 20px; border-top:1px solid var(--border); }
  .section.open .section-body { display:block; }

  /* Checklist items */
  .check-item {
    display:flex;
    align-items:flex-start;
    gap:10px;
    padding:8px 0;
    cursor:pointer;
  }
  .check-item input[type=checkbox] {
    appearance:none;
    width:18px; height:18px;
    border:2px solid var(--border);
    border-radius:4px;
    flex-shrink:0;
    margin-top:3px;
    cursor:pointer;
    transition:all .15s;
    background:transparent;
  }
  .check-item input[type=checkbox]:checked {
    background:var(--green);
    border-color:var(--green);
    position:relative;
  }
  .check-item input[type=checkbox]:checked::after {
    content:'';
    position:absolute;
    left:4px; top:1px;
    width:5px; height:9px;
    border:solid #000;
    border-width:0 2px 2px 0;
    transform:rotate(45deg);
  }
  .check-item.done .check-label { text-decoration:line-through; color:var(--text-dim); }

  .check-label { flex:1; font-size:0.9rem; }
  .check-who { font-size:0.75rem; font-weight:600; padding:1px 7px; border-radius:8px; flex-shrink:0; }
  .check-jeff { color:var(--accent); }
  .check-lou { color:var(--purple); }
  .check-both { color:var(--cyan); }

  /* Content blocks */
  .section-body h3 { font-size:0.9rem; font-weight:600; margin:16px 0 8px; color:var(--accent); }
  .section-body h4 { font-size:0.85rem; font-weight:600; margin:12px 0 6px; }
  .section-body p { font-size:0.88rem; color:var(--text-dim); margin-bottom:8px; }
  .section-body ul, .section-body ol { padding-left:20px; font-size:0.88rem; color:var(--text-dim); margin-bottom:8px; }
  .section-body li { margin-bottom:4px; }
  .section-body strong { color:var(--text); }
  .section-body code {
    background:#21262d;
    padding:1px 5px;
    border-radius:4px;
    font-size:0.82rem;
    color:var(--cyan);
    font-family: 'JetBrains Mono', 'Fira Code', monospace;
  }
  .section-body pre {
    background:#0d1117;
    border:1px solid var(--border);
    border-radius:var(--radius);
    padding:14px 16px;
    overflow-x:auto;
    margin:8px 0;
    font-size:0.82rem;
    font-family: 'JetBrains Mono', 'Fira Code', monospace;
    color:var(--text);
    line-height:1.5;
  }
  .section-body pre code { background:none; padding:0; color:inherit; }
  .section-body table {
    width:100%;
    border-collapse:collapse;
    margin:8px 0;
    font-size:0.85rem;
  }
  .section-body th, .section-body td {
    border:1px solid var(--border);
    padding:8px 12px;
    text-align:left;
  }
  .section-body th { background:#21262d; color:var(--text); font-weight:600; }
  .section-body td { color:var(--text-dim); }
  .section-body hr { border:none; border-top:1px solid var(--border); margin:16px 0; }
  .section-body blockquote {
    border-left:3px solid var(--accent);
    padding:8px 12px;
    margin:8px 0;
    background:rgba(88,166,255,.05);
    color:var(--text-dim);
    font-size:0.85rem;
  }

  .sub-section { margin:8px 0 4px 12px; border-left:2px solid var(--border); padding-left:16px; }

  /* Quick Reference Table */
  .quick-ref { font-size:0.85rem; }

  .reset-btn {
    background:var(--surface);
    border:1px solid var(--border);
    color:var(--text-dim);
    padding:6px 14px;
    border-radius:var(--radius);
    cursor:pointer;
    font-size:0.8rem;
    transition:all .15s;
  }
  .reset-btn:hover { border-color:var(--red); color:var(--red); }

  /* Info box */
  .info-box {
    background:rgba(57,210,192,.08);
    border:1px solid rgba(57,210,192,.2);
    border-radius:var(--radius);
    padding:12px 16px;
    margin:8px 0;
    font-size:0.85rem;
    color:var(--cyan);
  }
  .info-box strong { color:var(--cyan); }
  .warn-box {
    background:rgba(210,153,34,.08);
    border:1px solid rgba(210,153,34,.2);
    border-radius:var(--radius);
    padding:12px 16px;
    margin:8px 0;
    font-size:0.85rem;
    color:var(--yellow);
  }
  .warn-box strong { color:var(--yellow); }
  .done-box {
    background:rgba(63,185,80,.08);
    border:1px solid rgba(63,185,80,.2);
    border-radius:var(--radius);
    padding:12px 16px;
    margin:8px 0;
    font-size:0.85rem;
    color:var(--green);
  }

  /* Status indicators in lists */
  .status-done { color:var(--green); }
  .status-pending { color:var(--text-dim); }
  .status-progress { color:var(--yellow); }
  .status-done::before { content:'✅ '; }
  .status-pending::before { content:'⬜ '; }
  .status-progress::before { content:'🔄 '; }

  @media (max-width:640px) {
    body { padding:12px; }
    .section-header { flex-wrap:wrap; }
    .badge-group { width:100%; margin-left:34px; }
  }
</style>
</head>

/* --- Render --- */
function render() {
  const container = document.getElementById('sections');
  let html = '';

  DATA.forEach(s => {
    const itemCount = (s.items || []).length;
    const status = sectionStatus(s.id);
    const badgeClass = status === 'done' ? 'badge-done' : status === 'progress' ? 'badge-progress' : 'badge-pending';
    const badgeLabel = status === 'done' ? 'Done' : status === 'progress' ? 'In Progress' : 'Pending';
    const whoBadge = s.who === 'jeff' ? 'badge-jeff' : s.who === 'lou' ? 'badge-lou' : 'badge-both';
    const whoLabel = s.who === 'jeff' ? '👤 Jeff' : s.who === 'lou' ? '👤 Lou' : '👥 Both';

    html += `<div class="section" id="sec-${s.id}">`;
    html += `<div class="section-header" onclick="toggleSection('${s.id}')">`;
    html += `<span class="toggle">&#9654;</span>`;
    html += `<span class="num">${s.num}</span>`;
    html += `<h2>${s.title}</h2>`;
    html += `<div class="badge-group">`;
    html += `<span class="badge ${whoBadge}">${whoLabel}</span>`;
    if (itemCount > 0) html += `<span class="badge ${badgeClass}">${badgeLabel}</span>`;
    html += `</div></div>`;

    html += `<div class="section-body">`;

    if (s.phase) html += `<p style="font-size:0.8rem; color:var(--text-dim); margin-bottom:8px;"><strong>When:</strong> ${s.phase}</p>`;
    if (s.content) html += s.content;

    if (s.items) {
      s.items.forEach(item => {
        const checked = loadCheck(item.id) ? 'checked' : '';
        const done = loadCheck(item.id) ? 'done' : '';
        const whoCls = item.who === 'jeff' ? 'check-jeff' : item.who === 'lou' ? 'check-lou' : 'check-both';
        const whoLbl = item.who === 'jeff' ? '👤 Jeff' : item.who === 'lou' ? '👤 Lou' : '👥 Both';
        html += `<label class="check-item ${done}" data-id="${item.id}">`;
        html += `<input type="checkbox" ${checked} onchange="toggleCheck('${item.id}')">`;
        html += `<span class="check-label">${item.label}</span>`;
        html += `<span class="check-who ${whoCls}">${whoLbl}</span>`;
        html += `</label>`;
      });
    }

    html += `</div></div>`;
  });

  // Quick Reference
  html += `<div class="section" id="sec-quickref"><div class="section-header" onclick="toggleSection('quickref')">`;
  html += `<span class="toggle">&#9654;</span><span class="num" style="background:var(--purple);">QR</span>`;
  html += `<h2>Quick Reference — Account Access</h2></div>`;
  html += `<div class="section-body"><table class="quick-ref"><tr><th>Service</th><th>URL</th><th>Who</th></tr>`;
  QUICK_REF.forEach(r => {
    html += `<tr><td><strong>${r.svc}</strong></td><td><a href="${r.url}" target="_blank">${r.url}</a></td><td>${r.who}</td></tr>`;
  });
  html += `</table></div></div>`;

  container.innerHTML = html;
  updateProgress();
}

/* --- Storage --- */
function loadCheck(id) { return localStorage.getItem('rg-'+id) === 'true'; }
function saveCheck(id, val) { localStorage.setItem('rg-'+id, val); }

function toggleCheck(id) {
  const val = loadCheck(id);
  saveCheck(id, !val);
  const label = document.querySelector(`.check-item[data-id="${id}"]`);
  if (label) { label.classList.toggle('done'); }
  updateProgress();
}

function toggleSection(id) {
  const el = document.getElementById('sec-'+id);
  if (el) el.classList.toggle('open');
}

function sectionStatus(sid) {
  const s = DATA.find(d => d.id === sid);
  if (!s || !s.items || s.items.length === 0) return 'pending';
  const done = s.items.filter(i => loadCheck(i.id)).length;
  if (done === s.items.length) return 'done';
  if (done > 0) return 'progress';
  return 'pending';
}

function updateProgress() {
  let total = 0, done = 0;
  DATA.forEach(s => {
    if (s.items) {
      s.items.forEach(i => { total++; if (loadCheck(i.id)) done++; });
    }
  });
  document.getElementById('totalCount').textContent = total;
  document.getElementById('doneCount').textContent = done;
  const pct = total > 0 ? Math.round(done/total*100) : 0;
  document.getElementById('pctDisplay').textContent = pct + '%';
  document.getElementById('progressFill').style.width = pct + '%';

  // Update section badges
  DATA.forEach(s => {
    const badge = document.querySelector(`#sec-${s.id} .badge-group .badge:last-child`);
    if (!badge) return;
    const st = sectionStatus(s.id);
    badge.className = 'badge ' + (st === 'done' ? 'badge-done' : st === 'progress' ? 'badge-progress' : 'badge-pending');
    badge.textContent = st === 'done' ? 'Done' : st === 'progress' ? 'In Progress' : 'Pending';
  });
}

function resetAll() {
  if (!confirm('Reset ALL progress checkboxes?')) return;
  DATA.forEach(s => { if (s.items) s.items.forEach(i => localStorage.removeItem('rg-'+i.id)); });
  // Re-render checkboxes
  document.querySelectorAll('.check-item').forEach(el => {
    el.classList.remove('done');
    el.querySelector('input[type=checkbox]').checked = false;
  });
  updateProgress();
}

render();
</script>
