name: jeffdev

services:
  syntaxure-labs:
    build:
      context: .
      dockerfile: apps/syntaxure-labs/Dockerfile
    ports:
      - "3000:3000"
    env_file: apps/syntaxure-labs/.env
    depends_on:
      - cosmos
    networks:
      - jeffdev

  prism-engine:
    build:
      context: .
      dockerfile: apps/prism-engine/Dockerfile
    ports:
      - "3001:3001"
    env_file: apps/prism-engine/.env
    depends_on:
      - cosmos
    networks:
      - jeffdev

  prism-docs:
    build:
      context: .
      dockerfile: apps/prism-docs/Dockerfile
    ports:
      - "3002:3002"
    env_file: apps/prism-docs/.env
    networks:
      - jeffdev

  prism-admin:
    build:
      context: .
      dockerfile: apps/prism-admin/Dockerfile
    ports:
      - "3004:3004"
    env_file: apps/prism-admin/.env
    depends_on:
      - cosmos
    networks:
      - jeffdev

  prism-manage:
    build:
      context: .
      dockerfile: apps/prism-manage/Dockerfile
    ports:
      - "3007:3007"
    env_file: apps/prism-manage/.env
    depends_on:
      - cosmos
    networks:
      - jeffdev

  prism-analytics:
    build:
      context: apps/prism-analytics
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    networks:
      - jeffdev

  prism-mcp-server:
    build:
      context: .
      dockerfile: apps/prism-mcp-server/Dockerfile
    ports:
      - "3003:3003"
    env_file: apps/prism-mcp-server/.env
    depends_on:
      - cosmos
    networks:
      - jeffdev

  cosmos:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - cosmos_data:/data/db
    networks:
      - jeffdev

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - jeffdev

volumes:
  cosmos_data:
  redis_data:

networks:
  jeffdev:
    driver: bridge
