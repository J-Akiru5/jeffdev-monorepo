name: jeffdev

services:
  syntaxure-labs:
    build:
      context: .
      dockerfile: apps/syntaxure-labs/Dockerfile
    ports:
      - "3000:3000"
    env_file: apps/syntaxure-labs/.env
    networks:
      - jeffdev

  prism-engine:
    build:
      context: .
      dockerfile: apps/prism-engine/Dockerfile
    ports:
      - "3001:3001"
    env_file: apps/prism-engine/.env
    networks:
      - jeffdev

  prism-docs:
    build:
      context: .
      dockerfile: apps/prism-docs/Dockerfile
    ports:
      - "3002:3002"
    env_file: apps/prism-docs/.env
    networks:
      - jeffdev

  prism-admin:
    build:
      context: .
      dockerfile: apps/prism-admin/Dockerfile
    ports:
      - "3004:3004"
    env_file: apps/prism-admin/.env
    networks:
      - jeffdev

  prism-manage:
    build:
      context: .
      dockerfile: apps/prism-manage/Dockerfile
    ports:
      - "3007:3007"
    env_file: apps/prism-manage/.env
    networks:
      - jeffdev

  prism-mcp-server:
    build:
      context: .
      dockerfile: apps/prism-mcp-server/Dockerfile
    ports:
      - "3003:3003"
    env_file: apps/prism-mcp-server/.env
    networks:
      - jeffdev

  # Note: Prism's data store used to be `cosmos` (a local mongo:7 container
  # standing in for Azure Cosmos DB's MongoDB API). Prism now uses the same
  # Supabase Postgres project as every other app here — there's no local
  # Postgres container in this file for any app, they all point at the
  # cloud Supabase project via NEXT_PUBLIC_SUPABASE_URL/SUPABASE_SERVICE_ROLE_KEY
  # in each app's env_file. See PRISM_MIGRATION.md.

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - jeffdev

  n8n:
    image: n8nio/n8n:latest
    ports:
      - "5678:5678"
    volumes:
      - n8n_data:/home/node/.n8n
    environment:
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - WEBHOOK_URL=http://localhost:5678
    restart: unless-stopped
    networks:
      - jeffdev

volumes:
  redis_data:
  n8n_data:

networks:
  jeffdev:
    driver: bridge
