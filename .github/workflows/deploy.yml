# -------------------------------------------------------------------
# Deploy Pipeline — Selective deployment for monorepo apps
#
# Only deploys apps that have changed files
# -------------------------------------------------------------------

name: Deploy

on:
  push:
    branches: [main]
    paths-ignore: ["**.md"]

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  TURBO_TELEMETRY_DISABLED: 1
  PNPM_VERSION: 9.1.0
  NODE_VERSION: "22"

jobs:
  # ─── Step 1: Detect Changed Apps ─────────────────────────────────────────
  detect-changes:
    name: Detect Changed Apps
    runs-on: ubuntu-latest
    outputs:
      syntaxure-labs: ${{ steps.changes.outputs.syntaxure-labs }}
      syntaxure-pm: ${{ steps.changes.outputs.syntaxure-pm }}
      prism-engine: ${{ steps.changes.outputs.prism-engine }}
      prism-admin: ${{ steps.changes.outputs.prism-admin }}
      prism-manage: ${{ steps.changes.outputs.prism-manage }}
      prism-docs: ${{ steps.changes.outputs.prism-docs }}
      prism-mcp-server: ${{ steps.changes.outputs.prism-mcp-server }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Get changed files
        id: changed-files
        uses: tj-actions/changed-files@v44
        with:
          files_yaml: |
            syntaxure-labs:
              - apps/syntaxure-labs/**
              - packages/ui/**
              - packages/supabase/**
              - supabase/migrations/**
            syntaxure-pm:
              - apps/syntaxure-pm/**
              - packages/ui/**
              - packages/supabase/**
              - supabase/migrations/**
            prism-engine:
              - apps/prism-engine/**
              - packages/**
              - supabase/migrations/**
            prism-admin:
              - apps/prism-admin/**
              - packages/**
              - supabase/migrations/**
            prism-manage:
              - apps/prism-manage/**
              - packages/**
              - supabase/migrations/**
            prism-docs:
              - apps/prism-docs/**
              - packages/**
            prism-mcp-server:
              - apps/prism-mcp-server/**
              - packages/**
      - name: Set app flags
        id: changes
        run: |
          echo "syntaxure-labs=${{ steps.changed-files.outputs.syntaxure-labs_any_changed }}" >> "$GITHUB_OUTPUT"
          echo "syntaxure-pm=${{ steps.changed-files.outputs.syntaxure-pm_any_changed }}" >> "$GITHUB_OUTPUT"
          echo "prism-engine=${{ steps.changed-files.outputs.prism-engine_any_changed }}" >> "$GITHUB_OUTPUT"
          echo "prism-admin=${{ steps.changed-files.outputs.prism-admin_any_changed }}" >> "$GITHUB_OUTPUT"
          echo "prism-manage=${{ steps.changed-files.outputs.prism-manage_any_changed }}" >> "$GITHUB_OUTPUT"
          echo "prism-docs=${{ steps.changed-files.outputs.prism-docs_any_changed }}" >> "$GITHUB_OUTPUT"
          echo "prism-mcp-server=${{ steps.changed-files.outputs.prism-mcp-server_any_changed }}" >> "$GITHUB_OUTPUT"

  # ─── Step 2: Deploy syntaxure-labs ───────────────────────────────────────
  deploy-syntaxure-labs:
    name: Deploy syntaxure-labs
    needs: detect-changes
    if: needs.detect-changes.outputs.syntaxure-labs == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build syntaxure-labs
        run: pnpm --filter syntaxure-labs run build
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      - name: Deploy to Vercel
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_SYNTAXURE_LABS_PROJECT_ID }}
          working-directory: apps/syntaxure-labs
          vercel-args: "--prod"

  # ─── Step 3: Deploy syntaxure-pm ─────────────────────────────────────────
  deploy-syntaxure-pm:
    name: Deploy syntaxure-pm
    needs: detect-changes
    if: needs.detect-changes.outputs.syntaxure-pm == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build syntaxure-pm
        run: pnpm --filter syntaxure-pm run build
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      - name: Deploy to Vercel
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_SYNTAXURE_PM_PROJECT_ID }}
          working-directory: apps/syntaxure-pm
          vercel-args: "--prod"

  # ─── Step 4: Deploy prism-engine ─────────────────────────────────────────
  deploy-prism-engine:
    name: Deploy prism-engine
    needs: detect-changes
    if: needs.detect-changes.outputs.prism-engine == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build prism-engine
        run: pnpm --filter prism-engine run build
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      - name: Deploy to Vercel
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PRISM_ENGINE_PROJECT_ID }}
          working-directory: apps/prism-engine
          vercel-args: "--prod"

  # ─── Step 4: Deploy prism-admin ──────────────────────────────────────────
  deploy-prism-admin:
    name: Deploy prism-admin
    needs: detect-changes
    if: needs.detect-changes.outputs.prism-admin == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build prism-admin
        run: pnpm --filter prism-admin run build
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      - name: Deploy to Vercel
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PRISM_ADMIN_PROJECT_ID }}
          working-directory: apps/prism-admin
          vercel-args: "--prod"

  # ─── Step 5: Deploy prism-manage ─────────────────────────────────────────
  deploy-prism-manage:
    name: Deploy prism-manage
    needs: detect-changes
    if: needs.detect-changes.outputs.prism-manage == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build prism-manage
        run: pnpm --filter prism-manage run build
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      - name: Deploy to Vercel
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PRISM_MANAGE_PROJECT_ID }}
          working-directory: apps/prism-manage
          vercel-args: "--prod"

  # ─── Step 6: Deploy prism-docs ───────────────────────────────────────────
  deploy-prism-docs:
    name: Deploy prism-docs
    needs: detect-changes
    if: needs.detect-changes.outputs.prism-docs == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build prism-docs
        run: pnpm --filter prism-docs run build
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"
      - name: Deploy to Vercel
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PRISM_DOCS_PROJECT_ID }}
          working-directory: apps/prism-docs
          vercel-args: "--prod"

  # ─── Step 7: Deploy prism-mcp-server ─────────────────────────────────────
  deploy-prism-mcp-server:
    name: Deploy prism-mcp-server
    needs: detect-changes
    if: needs.detect-changes.outputs.prism-mcp-server == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build prism-mcp-server
        run: pnpm --filter prism-mcp-server run build
      - name: Deploy to Vercel
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PRISM_MCP_SERVER_PROJECT_ID }}
          working-directory: apps/prism-mcp-server
          vercel-args: "--prod"
