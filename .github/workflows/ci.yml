# -------------------------------------------------------------------
# CI Pipeline — check-types → lint → test → build
#
# Pipeline flow:
#   install (shared deps + cache)
#     ├── typecheck   ─┐
#     ├── lint         ├──> build (gated on all three passing)
#     └── test (matrix)┘
#                           └──> ci-status (aggregate check for branch protection)
#
# Branch protection rule name: "CI Status (typecheck, lint, test, build)"
# -------------------------------------------------------------------

name: CI

on:
  pull_request:
    branches: [main]
    paths-ignore: ["**.md"]
  push:
    branches: [main, develop]
    paths-ignore: ["**.md"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TURBO_TELEMETRY_DISABLED: 1
  PNPM_VERSION: 9.1.0
  NODE_VERSION: "22"

jobs:
  # ─── Step 1: Install & Cache ──────────────────────────────────────────────
  install:
    name: Install Dependencies
    runs-on: ubuntu-latest
    outputs:
      pnpm-store-path: ${{ steps.pnpm-cache.outputs.path }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Get pnpm store path
        id: pnpm-cache
        run: echo "path=$(pnpm store path)" >> "$GITHUB_OUTPUT"
      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.path }}
          key: pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-store-
      - run: pnpm install --frozen-lockfile
      - name: Cache turbo build outputs
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ github.sha }}
          restore-keys: |
            turbo-

  # ─── Step 2a: Type Check ─────────────────────────────────────────────────
  typecheck:
    name: Type Check
    needs: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Restore pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Restore turbo cache
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ github.sha }}
      - run: pnpm install --frozen-lockfile --prefer-offline
      - run: pnpm run check-types

  # ─── Step 2b: Lint (parallel with typecheck) ─────────────────────────────
  lint:
    name: Lint
    needs: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Restore pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Restore turbo cache
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ github.sha }}
      - run: pnpm install --frozen-lockfile --prefer-offline
      - run: pnpm run lint

  # ─── Step 2c: Test (parallel with typecheck & lint) ──────────────────────
  test:
    name: Test (${{ matrix.package }})
    needs: install
    strategy:
      fail-fast: false
      matrix:
        package: [prism-context-engine, prism-mcp-server]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Restore pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Restore turbo cache
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ github.sha }}
      - run: pnpm install --frozen-lockfile --prefer-offline

      # prism-context-engine depends on prism-mcp-server — build it first
      - name: Build prism-mcp-server (prism-context-engine dependency)
        if: matrix.package == 'prism-context-engine'
        run: pnpm --filter prism-mcp-server run build

      - name: Run tests
        run: pnpm --filter ${{ matrix.package }} run test -- --reporter=verbose
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI || '' }}

  # ─── Step 3: Build (gated on typecheck + lint + test passing) ────────────
  build:
    name: Build (${{ matrix.app }})
    needs: [typecheck, lint, test]
    strategy:
      fail-fast: false
      matrix:
        app:
          - prism-engine
          - prism-admin
          - prism-manage
          - syntaxure-labs
          - prism-docs
          - prism-mcp-server
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Restore pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Restore turbo cache
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ github.sha }}
      - run: pnpm install --frozen-lockfile --prefer-offline
      - run: pnpm --filter ${{ matrix.app }} run build
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY || '' }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY || '' }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://placeholder.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'placeholder-anon-key' }}

  # ─── Step 4: Status Gate (aggregate check for branch protection) ─────────
  # This job always runs and checks all dependencies — if any upstream job
  # failed or was skipped, this fails so the PR cannot merge.
  ci-status:
    name: CI Status (typecheck, lint, test, build)
    needs: [typecheck, lint, test, build]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: "Check: typecheck"
        run: |
          if [ "${{ needs.typecheck.result }}" != "success" ]; then
            echo "Result: ${{ needs.typecheck.result }}"
            exit 1
          fi
      - name: "Check: lint"
        run: |
          if [ "${{ needs.lint.result }}" != "success" ]; then
            echo "Result: ${{ needs.lint.result }}"
            exit 1
          fi
      - name: "Check: tests"
        run: |
          if [ "${{ needs.test.result }}" != "success" ]; then
            echo "Result: ${{ needs.test.result }}"
            exit 1
          fi
      - name: "Check: build"
        run: |
          if [ "${{ needs.build.result }}" != "success" ]; then
            echo "Result: ${{ needs.build.result }}"
            exit 1
          fi
      - name: All checks passed
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "  ✅  All CI checks passed!"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
