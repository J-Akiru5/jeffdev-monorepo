# -------------------------------------------------------------------
# CI Pipeline — check-types → lint → test → build
#
# Pipeline flow:
#   install (shared deps + cache)
#     ├── typecheck   ─┐
#     ├── lint         ├──> build (gated on all three passing)
#     └── test (matrix)┘
#                           └──> ci-status (aggregate check for branch protection)
#
# Branch protection rule name: "CI Status (typecheck, lint, test, build)"
# -------------------------------------------------------------------

name: CI

on:
  pull_request:
    branches: [main]
    paths-ignore: ["**.md"]
  push:
    branches: [main, develop, staging]
    paths-ignore: ["**.md"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TURBO_TELEMETRY_DISABLED: 1
  NODE_VERSION: "22"

jobs:
  # ─── Step 1: Install & Cache ──────────────────────────────────────────────
  install:
    name: Install Dependencies
    runs-on: ubuntu-latest
    outputs:
      pnpm-store-path: ${{ steps.pnpm-cache.outputs.path }}
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Get pnpm store path
        id: pnpm-cache
        run: echo "path=$(pnpm store path)" >> "$GITHUB_OUTPUT"
      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.path }}
          key: pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-store-
      - run: npm install -g napi-postinstall
      - run: pnpm install --frozen-lockfile
      - name: Cache turbo build outputs
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ github.sha }}
          restore-keys: |
            turbo-

  # ─── Step 2a: Type Check ─────────────────────────────────────────────────
  typecheck:
    name: Type Check
    needs: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Restore pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Restore turbo cache
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ github.sha }}
      - run: npm install -g napi-postinstall
      - run: pnpm install --frozen-lockfile --prefer-offline
      - run: pnpm run check-types

  # ─── Step 2b: Lint (parallel with typecheck) ─────────────────────────────
  lint:
    name: Lint
    needs: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Restore pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Restore turbo cache
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ github.sha }}
      - run: npm install -g napi-postinstall
      - run: pnpm install --frozen-lockfile --prefer-offline
      - run: pnpm run lint

  # ─── Step 2c: Test (parallel with typecheck & lint) ──────────────────────
  test:
    name: Test (${{ matrix.package }})
    needs: install
    strategy:
      fail-fast: false
      matrix:
        package: [prism-context-engine, prism-mcp-server]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Restore pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Restore turbo cache
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ github.sha }}
      - run: npm install -g napi-postinstall
      - run: pnpm install --frozen-lockfile --prefer-offline

      # prism-context-engine depends on prism-mcp-server — build it first
      - name: Build prism-mcp-server (prism-context-engine dependency)
        if: matrix.package == 'prism-context-engine'
        run: pnpm --filter prism-mcp-server run build

      - name: Run tests
        run: pnpm --filter ${{ matrix.package }} run test -- --reporter=verbose
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI || '' }}

  # ─── Step 2d: Detect Changed Apps ─────────────────────────────────────────
  detect-changes:
    name: Detect Changed Apps
    needs: install
    runs-on: ubuntu-latest
    outputs:
      apps: ${{ steps.changes.outputs.apps }}
      syntaxure-labs: ${{ steps.changes.outputs.syntaxure-labs }}
      syntaxure-pm: ${{ steps.changes.outputs.syntaxure-pm }}
      prism-engine: ${{ steps.changes.outputs.prism-engine }}
      prism-admin: ${{ steps.changes.outputs.prism-admin }}
      prism-manage: ${{ steps.changes.outputs.prism-manage }}
      prism-docs: ${{ steps.changes.outputs.prism-docs }}
      prism-mcp-server: ${{ steps.changes.outputs.prism-mcp-server }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Get changed files
        id: changed-files
        uses: tj-actions/changed-files@v47
        with:
          files_yaml: |
            syntaxure-labs:
              - apps/syntaxure-labs/**
              - packages/ui/**
              - packages/supabase/**
              - supabase/migrations/**
            syntaxure-pm:
              - apps/syntaxure-pm/**
              - packages/ui/**
              - packages/supabase/**
              - supabase/migrations/**
            prism-engine:
              - apps/prism-engine/**
              - packages/**
              - supabase/migrations/**
            prism-admin:
              - apps/prism-admin/**
              - packages/**
              - supabase/migrations/**
            prism-manage:
              - apps/prism-manage/**
              - packages/**
              - supabase/migrations/**
            prism-docs:
              - apps/prism-docs/**
              - packages/**
            prism-mcp-server:
              - apps/prism-mcp-server/**
              - packages/**
      - name: Set app flags
        id: changes
        run: |
          echo "syntaxure-labs=${{ steps.changed-files.outputs.syntaxure-labs_any_changed }}" >> "$GITHUB_OUTPUT"
          echo "syntaxure-pm=${{ steps.changed-files.outputs.syntaxure-pm_any_changed }}" >> "$GITHUB_OUTPUT"
          echo "prism-engine=${{ steps.changed-files.outputs.prism-engine_any_changed }}" >> "$GITHUB_OUTPUT"
          echo "prism-admin=${{ steps.changed-files.outputs.prism-admin_any_changed }}" >> "$GITHUB_OUTPUT"
          echo "prism-manage=${{ steps.changed-files.outputs.prism-manage_any_changed }}" >> "$GITHUB_OUTPUT"
          echo "prism-docs=${{ steps.changed-files.outputs.prism-docs_any_changed }}" >> "$GITHUB_OUTPUT"
          echo "prism-mcp-server=${{ steps.changed-files.outputs.prism-mcp-server_any_changed }}" >> "$GITHUB_OUTPUT"

          # Build apps list for matrix
          apps=""
          if [ "${{ steps.changed-files.outputs.syntaxure-labs_any_changed }}" == "true" ]; then
            apps="syntaxure-labs"
          fi
          if [ "${{ steps.changed-files.outputs.syntaxure-pm_any_changed }}" == "true" ]; then
            apps="$apps,syntaxure-pm"
          fi
          if [ "${{ steps.changed-files.outputs.prism-engine_any_changed }}" == "true" ]; then
            apps="$apps,prism-engine"
          fi
          if [ "${{ steps.changed-files.outputs.prism-admin_any_changed }}" == "true" ]; then
            apps="$apps,prism-admin"
          fi
          if [ "${{ steps.changed-files.outputs.prism-manage_any_changed }}" == "true" ]; then
            apps="$apps,prism-manage"
          fi
          if [ "${{ steps.changed-files.outputs.prism-docs_any_changed }}" == "true" ]; then
            apps="$apps,prism-docs"
          fi
          if [ "${{ steps.changed-files.outputs.prism-mcp-server_any_changed }}" == "true" ]; then
            apps="$apps,prism-mcp-server"
          fi

          # Remove leading comma
          apps=$(echo "$apps" | sed 's/^,//')

          # Build a valid JSON array (bare "prism-engine,syntaxure-pm" is NOT
          # valid JSON — fromJson() in the build job's matrix needs quoted
          # elements, or it errors out and the "build" job never runs at all).
          if [ -n "$apps" ]; then
            apps_json="[\"$(echo "$apps" | sed 's/,/","/g')\"]"
          else
            apps_json="[]"
          fi
          echo "apps=$apps_json" >> "$GITHUB_OUTPUT"

  # ─── Step 3: Build (gated on typecheck + lint + test passing) ────────────
  build:
    name: Build (${{ matrix.app }})
    needs: [typecheck, lint, test, detect-changes]
    if: needs.detect-changes.outputs.apps != '[]'
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJson(needs.detect-changes.outputs.apps) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Restore pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Restore turbo cache
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ github.sha }}
      - run: npm install -g napi-postinstall
      - run: pnpm install --frozen-lockfile --prefer-offline
      - run: pnpm --filter ${{ matrix.app }} run build
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://placeholder.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'placeholder-anon-key' }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || 'placeholder-service-role-key' }}

  # ─── Step 4: Status Gate (aggregate check for branch protection) ─────────
  # This job always runs and checks all dependencies — if any upstream job
  # failed or was skipped, this fails so the PR cannot merge.
  ci-status:
    name: CI Status (typecheck, lint, test, build)
    needs: [install, typecheck, lint, test, detect-changes, build]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: "Check: install"
        run: |
          if [ "${{ needs.install.result }}" != "success" ]; then
            echo "Install failed — cannot proceed"
            exit 1
          fi
      - name: "Check: typecheck"
        run: |
          if [ "${{ needs.typecheck.result }}" == "failure" ]; then
            echo "Result: ${{ needs.typecheck.result }}"
            exit 1
          fi
      - name: "Check: lint"
        run: |
          if [ "${{ needs.lint.result }}" == "failure" ]; then
            echo "Result: ${{ needs.lint.result }}"
            exit 1
          fi
      - name: "Check: tests"
        run: |
          if [ "${{ needs.test.result }}" == "failure" ]; then
            echo "Result: ${{ needs.test.result }}"
            exit 1
          fi
      - name: "Check: build"
        run: |
          if [ "${{ needs.build.result }}" == "failure" ]; then
            echo "Result: ${{ needs.build.result }}"
            exit 1
          fi
      - name: All checks passed
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "  ✅  All CI checks passed!"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
