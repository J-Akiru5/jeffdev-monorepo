name: 'Prism Code Review'
description: 'Check PR code against Prism architectural rules'
author: 'JeffDev Studio'

inputs:
  api-key:
    description: 'Prism API key'
    required: true
  api-url:
    description: 'Prism API URL'
    required: false
    default: 'https://prism.jeffdev.studio'
  project-id:
    description: 'Project ID in Prism'
    required: true
  fail-on-violation:
    description: 'Fail the check if violations are found'
    required: false
    default: 'false'

runs:
  using: 'composite'
  steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Detect changed files
      id: changed-files
      uses: tj-actions/changed-files@v45
      with:
        separator: ','

    - name: Run Prism code review
      id: prism-review
      shell: bash
      env:
        PRISM_API_KEY: ${{ inputs.api-key }}
        PRISM_API_URL: ${{ inputs.api-url }}
        CHANGED_FILES: ${{ steps.changed-files.outputs.all_changed_files }}
        PROJECT_ID: ${{ inputs.project-id }}
      run: |
        echo "::group::Prism Code Review"
        IFS=',' read -ra FILES <<< "$CHANGED_FILES"
        VIOLATIONS=0
        REPORT=""

        for file in "${FILES[@]}"; do
          if [[ ! -f "$file" ]]; then
            continue
          fi

          EXT="${file##*.}"
          case "$EXT" in
            ts|tsx|js|jsx|css|scss|md|json|yaml|yml) ;;
            *) continue ;;
          esac

          CODE=$(cat "$file")
          ESCAPED_CODE=$(echo "$CODE" | jq -Rs .)

          RESPONSE=$(curl -s -X POST "$PRISM_API_URL/api/v1/rules/validate" \
            -H "Content-Type: application/json" \
            -H "x-api-key: $PRISM_API_KEY" \
            -d "{\"code\": $ESCAPED_CODE, \"context\": \"$file\", \"projectId\": \"$PROJECT_ID\"}")

          ISSUES=$(echo "$RESPONSE" | jq -r '.violations // [] | length')
          if [ "$ISSUES" -gt 0 ]; then
            VIOLATIONS=$((VIOLATIONS + ISSUES))
            REPORT+="## $file\n"
            REPORT+=$(echo "$RESPONSE" | jq -r '.violations[] | "- **\(.severity)**: \(.message) (rule: \(.rule))"')
            REPORT+="\n"
          fi
        done

        echo "violations=$VIOLATIONS" >> $GITHUB_OUTPUT

        if [ "$VIOLATIONS" -gt 0 ]; then
          echo "report<<EOF" >> $GITHUB_OUTPUT
          echo -e "$REPORT" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
        fi
        echo "::endgroup::"

    - name: Post PR comment
      if: ${{ steps.prism-review.outputs.violations > 0 }}
      uses: actions/github-script@v7
      with:
        script: |
          const violations = parseInt('${{ steps.prism-review.outputs.violations }}');
          const report = `${{ steps.prism-review.outputs.report }}`;

          const body = `## 🔍 Prism Code Review\n\n### Found **${violations}** violation(s)\n\n${report}\n\n---\n_Powered by [Prism Context Engine](https://prism.jeffdev.studio)_`;

          await github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: body
          });

    - name: Fail on violations
      if: ${{ inputs.fail-on-violation == 'true' && steps.prism-review.outputs.violations > 0 }}
      shell: bash
      run: |
        echo "::error::Prism found ${{ steps.prism-review.outputs.violations }} code violation(s)."
        exit 1
